name: SHADOW - Confirmar fontes históricas UEFA/Taça
on:
  pull_request:
    paths:
      - "estatisticas_hibridas_competicoes.py"
      - ".github/workflows/shadow-fontes-uefa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmar-publico:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/shadow-cobertura-uefa-taca-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar torneio epoca e resultados reais SofaScore (sem odds nem Railway)
        shell: bash
        run: |
          python3 -m pip -q install curl_cffi==0.16.3
          python3 - <<'PY'
          import json
          from curl_cffi import requests
          from datetime import datetime, timezone

          TORNEIOS = {"uefa.champions": 7, "por.taca.portugal": 336}
          SITES = ("https://api.sofascore.com/api/v1", "https://www.sofascore.com/api/v1")
          sessao = requests.Session()
          try:
              sessao.get("https://www.sofascore.com/", impersonate="chrome", timeout=8)
          except Exception:
              pass
          def obter(caminho):
              estados = []
              for base in SITES:
                  try:
                      resposta = sessao.get(
                          base + caminho, impersonate="chrome", timeout=12,
                          headers={
                              "Accept": "application/json, text/plain, */*",
                              "Origin": "https://www.sofascore.com",
                              "Referer": "https://www.sofascore.com/",
                          },
                      )
                      if resposta.status_code == 200:
                          return resposta.json()
                      estados.append(str(resposta.status_code))
                  except Exception:
                      estados.append("network")
              raise RuntimeError("HTTP status tentados=" + ",".join(estados))

          falhas = []
          for codigo, tournament_id in TORNEIOS.items():
              try:
                  dados = obter(f"/unique-tournament/{tournament_id}/seasons")
                  epocas = [
                      int(s["id"]) for s in dados.get("seasons", [])
                      if str(s.get("year") or "") == "26/27"
                  ]
                  if len(epocas) != 1:
                      raise RuntimeError("Época 26/27 não é única")
                  season_id = epocas[0]
                  resultados = 0
                  paginas = 0
                  ids = set()
                  limite = 8
                  for pagina in range(limite):
                      payload = obter(
                          f"/unique-tournament/{tournament_id}/season/{season_id}/events/last/{pagina}"
                      )
                      eventos = payload.get("events")
                      if not isinstance(eventos, list):
                          raise RuntimeError("Resposta sem lista events")
                      paginas += 1
                      for e in eventos:
                          status = e.get("status") or {}
                          if status.get("code") != 100 and status.get("type") not in (
                              "finished", "afterextra", "afterpenalties", "ended"
                          ):
                              continue
                          score_casa = e.get("homeScore") or {}
                          score_fora = e.get("awayScore") or {}
                          # Mesma regra do coletor: exigir resultados normaltime reais.
                          if not isinstance(score_casa.get("normaltime"), (int, float)):
                              continue
                          if not isinstance(score_fora.get("normaltime"), (int, float)):
                              continue
                          if e.get("startTimestamp", 0) >= datetime.now(timezone.utc).timestamp():
                              continue
                          ids.add(e.get("id"))
                      resultados = len(ids)
                      if resultados >= 10 or not payload.get("hasNextPage"):
                          break
                  print(
                      f"{codigo}: torneio={tournament_id}, epoca=26/27, "
                      f"pagina(s)={paginas}, resultados_finais_verificados={resultados}",
                      flush=True,
                  )
                  if resultados < 10:
                      raise RuntimeError(f"amostra real insuficiente: {resultados}/10")
              except Exception as exc:
                  # Sem URL privada, token, headers ou payload nos logs.
                  falhas.append(codigo)
                  detalhe = str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__
                  print(f"{codigo}: indisponível ({detalhe})", flush=True)
          if falhas:
              raise SystemExit("Sem validação externa completa: " + ", ".join(falhas))
          print("VALIDADO: dados reais suficientes em ambos os torneios; nenhuma alteração produção.")
          PY
