name: SHADOW historical sources (no production)

on:
  pull_request:
    paths:
      - "estatisticas_hibridas_competicoes.py"
      - "scripts/shadow_historico_tacas.py"
      - ".github/workflows/shadow-historico.yml"

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public source dependencies
        run: python -m pip install "requests>=2.32.4,<3" "curl_cffi==0.16.3" "tzdata>=2025.2"
      - name: Source smoke (no credentials, no production volume)
        run: python scripts/shadow_historico_tacas.py
