name: Historical coverage replay - SHADOW read only

on:
  pull_request:
    branches: [main]
    paths:
      - "estatisticas_hibridas_competicoes.py"
      - "estatisticas_espn_competicoes.py"
      - "buscador_jogos_reais.py"
      - "scripts/verificar_historicos_shadow.py"
      - "scripts/comparar_cobertura_shadow.py"
      - "scripts/comparar_top5_universo_shadow.py"
      - "estatisticas_espn_resiliente.py"
      - "tests/test_forma_calendario_espn_shadow.py"
      - "tests/test_shadow_selecoes_regressao.py"
      - ".github/workflows/historico-shadow-smoke.yml"

permissions:
  contents: read

jobs:
  historico-replay-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Smoke histórico real read-only (sem modelo / Railway)
        run: python -m scripts.verificar_historicos_shadow
      - name: Replay de cobertura real em memória (sem picks / sem gravações)
        if: always()
        run: python -m scripts.comparar_cobertura_shadow
      - name: Universo Top5 das ligas reconhecidas (sem odds / sem gravações)
        if: always()
        run: python -m scripts.comparar_top5_universo_shadow
