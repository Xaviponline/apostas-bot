name: SofaScore historical smoke - SHADOW read only

on:
  pull_request:
    branches: [main]
    paths:
      - "estatisticas_hibridas_competicoes.py"
      - "estatisticas_espn_competicoes.py"
      - "buscador_jogos_reais.py"
      - "scripts/verificar_historicos_shadow.py"
      - "scripts/sondar_espn_shadow.py"
      - "scripts/comparar_cobertura_shadow.py"
      - "scripts/sondar_forma_espn_shadow.py"
      - ".github/workflows/historico-shadow-smoke.yml"

permissions:
  contents: read

jobs:
  sofa-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Smoke histórico real read-only (sem modelo / Railway)
        run: python -m scripts.verificar_historicos_shadow
      - name: Sondagem ESPN por dia e intervalo (diagnóstico apenas)
        if: always()
        run: python -m scripts.sondar_espn_shadow
      - name: Replay de cobertura real em memória (sem picks / sem gravações)
        if: always()
        run: python -m scripts.comparar_cobertura_shadow
      - name: Diagnóstico de forma por equipa ESPN (sem picks)
        if: always()
        run: python -m scripts.sondar_forma_espn_shadow
