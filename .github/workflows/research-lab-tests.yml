name: Research Lab unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - "research_lab/**"
      - "research_export.py"
      - "requirements-lab.txt"
      - ".github/workflows/research-lab-tests.yml"
  push:
    branches: [main]
    paths:
      - "research_lab/**"
      - "research_export.py"
      - "requirements-lab.txt"
      - ".github/workflows/research-lab-tests.yml"

jobs:
  lab-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lab.txt
      - name: Run Research Lab tests
        run: python -m unittest discover -s research_lab/tests -p 'test_*.py' -v
