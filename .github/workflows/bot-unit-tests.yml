name: Bot unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run bot unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Sonda live limitada apenas a este PR de investigacao em SHADOW.
      # Uma falha de fonte externa nao invalida os testes deterministas.
      - name: Probe SofaScore historico SHADOW (somente leitura)
        if: github.event_name == 'pull_request' && github.head_ref == 'test/uefa-taca-historical-coverage-20261014'
        continue-on-error: true
        timeout-minutes: 4
        run: python -m tools.probe_uefa_taca_shadow
